name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into HTML files
        run: |
          find . -name "*.html" -not -path "./.git/*" | xargs sed -i "s|PLACEHOLDER_GOOGLE_CALENDAR_API_KEY|${{ secrets.GOOGLE_CALENDAR_API_KEY }}|g"
          find . -name "*.js" -not -path "./.git/*" | xargs sed -i "s|PLACEHOLDER_CLAUDE_API_KEY|${{ secrets.CLAUDE_API_KEY }}|g"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
